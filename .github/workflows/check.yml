name: Userscript check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify distributable
        run: node scripts/build.mjs --check
      - name: Check syntax
        run: |
          node --check src/coupon-pilot.shell.js
          node --check modules/harris-teeter.js
          node --check modules/lowes-foods.js
          node --check modules/walgreens.js
          node --check modules/manifest.mjs
          node --check coupon-pilot.user.js
      - name: Check safety contract
        run: |
          node tests/static-checks.mjs
          node tests/module-contracts.mjs
          node tests/module-manager.mjs
          node tests/privacy-checks.mjs
